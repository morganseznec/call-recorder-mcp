[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "call-recorder-mcp"
dynamic = ["version"]
description = "Model Context Protocol server that records calls on macOS (WhatsApp, Teams, Zoom, browser) and transcribes them locally with Whisper, with speaker separation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Morgan Seznec" },
]
keywords = ["mcp", "claude", "claude-code", "anthropic", "whisper", "transcription", "macos", "speaker-diarization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mcp>=2.3,<3",
    "sherpa-onnx>=2,<3",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
]

[project.scripts]
call-recorder-mcp = "call_recorder_mcp.server:main"
call-recorder-setup = "call_recorder_mcp.installer:main"

[project.urls]
Homepage = "https://github.com/morganseznec/call-recorder-mcp"
Repository = "https://github.com/morganseznec/call-recorder-mcp"
Issues = "https://github.com/morganseznec/call-recorder-mcp/issues"
Changelog = "https://github.com/morganseznec/call-recorder-mcp/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/call_recorder_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/call_recorder_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# French user-facing strings legitimately contain typographic apostrophes.
ignore = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
